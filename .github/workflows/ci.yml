name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-2022
    env:
      QT_VERSION: 6.8.3
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtmultimedia
          "$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64/bin" >> $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E cli-help
