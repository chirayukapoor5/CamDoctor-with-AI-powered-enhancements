name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package Windows x64
    runs-on: windows-latest
    env:
      QT_VERSION: 6.8.3
      QT_QPA_PLATFORM: offscreen
      ARTIFACT_NAME: WebcamSettings-Windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --modules qtmultimedia
          "$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64/bin" >> $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -E cli-help

      - name: Install application
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\package"

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath "$env:ARTIFACT_NAME.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: WebcamSettings-Windows-x64
          path: WebcamSettings-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: WebcamSettings-Windows-x64
          path: release-assets

      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets -File | Sort-Object Name
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content release-assets/SHA256SUMS.txt

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw
          $heading = [regex]::Match($changelog, "(?m)^##\s+$([regex]::Escape($version))(\s|$).*")
          if (-not $heading.Success) {
            throw "No CHANGELOG.md section found for version $version."
          }
          $remaining = $changelog.Substring($heading.Index + $heading.Length)
          $nextHeading = [regex]::Match($remaining, '(?m)^##\s+')
          if ($nextHeading.Success) {
            $notes = $remaining.Substring(0, $nextHeading.Index).Trim()
          } else {
            $notes = $remaining.Trim()
          }
          if (-not $notes) {
            throw "The CHANGELOG.md section for version $version is empty."
          }
          Set-Content -Path release-notes.md -Value $notes -NoNewline

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          & gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --notes-file release-notes.md --title "CamDoctor $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
